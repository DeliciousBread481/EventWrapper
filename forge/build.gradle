plugins {
    id 'java'
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge' version '2.0.78'
}

archivesBaseName =  mod_id + "-" + archivesBaseName
version = "${minecraft_version}-${mod_version}"

if (System.getenv().RELEASE_MODE != "1") {
    version += '-SNAPSHOT'
}

mixin{
    add sourceSets.main, "eventwrapper.refmap.json"

    config "eventwrapper_common.mixins.json"
    config "eventwrapper_forge.mixins.json"
}

repositories {
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/" // for emi
    }
    maven {
        name = "Unascribed"
        url "https://repo.unascribed.com" // for ears
        content {
            includeGroup "com.unascribed"
        }
    }
    maven { // CURSE
        name "CurseMaven"
        url "https://www.cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
}

sourceSets.main.java {
    exclude 'io/github/lounode/eventwrapper/fabric/**'
}

legacyForge {
    version = minecraft_version + "-" + forge_version
    accessTransformers = [project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')]

    parchment {
        minecraftVersion = minecraft_version
        mappingsVersion = mapping_version
    }

    runs {
        client {
            client()
            systemProperty('forge.logging.console.level', 'debug')

            jvmArgument("-DdebugEvent=true")
        }

        server {
            server()
            systemProperty('forge.logging.console.level', 'debug')
        }
        /*
        data {
            data()
            programArguments.addAll "-mixin.config=eventwrapper_common.mixins.json", "-mixin.config=eventwrapper_forge.mixins.json"
            programArguments.addAll '--mod', 'eventwrapper', '--all'
            programArguments.addAll '--output', file('src/generated/resources/').getAbsolutePath()
            programArguments.addAll '--existing', file('src/main/resources/').getAbsolutePath()
        }


        gameTestServer {
            //type 'gameTestServer'
            //server()
            systemProperty('forge.enabledGameTestNamespaces', "eventwrapper")
            systemProperty('forge.logging.console.level', 'debug')
        }
        */

        configureEach {
            gameDirectory = file('../run/')
            systemProperty('fml.earlyprogresswindow', 'false')

            jvmArgument("-XX:+AllowEnhancedClassRedefinition")

        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    compileOnly project(":common")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    modRuntimeOnly ("curse.maven:nbtedit-reborn-678133:5984630")

    compileOnly "org.jetbrains:annotations:24.0.1"
    compileOnly "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    //implementation fileTree(dir: "${rootDir}/lib", include: ['*.jar'])
    //implementation 'org.objenesis:objenesis:3.4'
    //implementation files('libs/objenesis-3.4.jar')
}

compileJava {
    source(project(":common").sourceSets.main.allSource)
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial"
}

sourcesJar {
    from project(":common").sourceSets.main.allJava
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

processResources {
    from project(":common").sourceSets.main.resources
    inputs.property "version", project.version

    // Exclude datagenerator .cache directory
    exclude '.cache'
}

def generateModMetadataForge = tasks.register('generateModMetadataForge', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description, mod_logo: mod_logo,
            jei_version: jei_version, jei_version_range: jei_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties


    from "src/main/template"
    into "build/generated/sources/modMetaData"
}

sourceSets.main.resources.srcDir generateModMetadataForge
legacyForge.ideSyncTask generateModMetadataForge

jar {
    manifest {
        attributes([
                "Specification-Title": "${artifact_name}",
                "Specification-Vendor": "lounode",
                "Specification-Version": "1", // We are version 1 of ourselves
                "Implementation-Title": "${artifact_name}",
                "Implementation-Version": "${archiveVersion.get()}",
                "Implementation-Vendor" :"lounode",
                "MixinConfigs": "eventwrapper_common.mixins.json,eventwrapper_forge.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

task apiJar(type: Jar, dependsOn: classes) {
    // Sources included because of MinecraftForge/ForgeGradle#369
    from project(":common").sourceSets.main.allJava
    from(sourceSets.main.allJava)
    from(sourceSets.main.output)

    include 'java/io/github/lounode/eventwrapper/api/**'

    archiveClassifier = 'api'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId mod_group_id
            artifactId project.archivesBaseName
            version project.version
            artifact jar
            artifact sourcesJar
            artifact apiJar
            pom.withXml {
                def node = asNode()
                if(node.dependencies.size() > 0)
                    node.remove(node.dependencies) // Remove deps, as they are all mappings-dependent and/or forge
            }

            //println "将发布到: ${groupId}:${artifactId}:${version}"
            //println "本地仓库路径: ${System.properties['user.home']}/.m2/repository"
        }
    }

    repositories {
        if (System.getenv("GITHUB_ACTIONS") != null) {
            maven {
                name = "lounode"
                url = "https://maven.lounode.top/releases"
                credentials {
                    username = System.getenv("MAVEN_USERNAME")
                    password = System.getenv("MAVEN_TOKEN")
                }
            }
        } else {
            mavenLocal()
        }
    }
}