plugins {
    id 'fabric-loom' version '1.10-SNAPSHOT'
    id 'maven-publish'
}

base.archivesName = mod_id + "-" + "fabric"
version = "${minecraft_version}-${mod_version}"

if (System.getenv().RELEASE_MODE == null) {
    version += '-SNAPSHOT'
}

repositories {
    mavenLocal()
    maven {
        name = "Modmuss"
        url = "https://maven.modmuss50.me/"
    }
    maven {
        name = "Jared"
        url = "https://maven.blamejared.com/" // for JEI and Patchouli
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/" // for trinkets and emi
    }
    maven {
        name = "Ladysnake Libs"
        url = 'https://maven.ladysnake.org/releases'
    }
    maven {
        name = "BuildCraft" // for LBA
        url = "https://mod-buildcraft.com/maven"
    }
    maven {
        name = "entity reach"
        url = "https://maven.jamieswhiteshirt.com/libs-release/"
    }
    maven {
        url = "https://jitpack.io" // for step height eam
    }
    maven {
        url = "https://maven.shedaniel.me/" // for rei
    }
    maven {
        name = "ParchmentMC"
        url = "https://maven.parchmentmc.net/"
    }
    maven {
        name = "Unascribed"
        url = "https://repo.unascribed.com" // for ears
        content {
            includeGroup "com.unascribed"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven" // for "here be no dragons"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        name = "Forge"
        url = "https://maven.minecraftforge.net"
    }
}

loom {
    accessWidenerPath = file("src/main/resources/eventwrapper.accesswidener")
    mixin.defaultRefmapName = "eventwrapper.refmap.json"

    runs {
        client{
            vmArg "-DdebugEvent=true"
            vmArg "-XX:+AllowEnhancedClassRedefinition"
        }

        gameTest {
            server()
            vmArg "-DdebugEvent=true"
            vmArg "-Dfabric-api.gametest=1"
        }

        configureEach {
            runDir "../run/"
            ideConfigGenerated(true)

            programArgs.addAll("--username", "Dev")
            programArgs.addAll("--uuid", "4f201c25-b473-4c2c-959a-dea681f79c23")
        }
    }

    mods {
        eventwrapper {
            sourceSet(sourceSets.main)
            sourceSet project(":common").sourceSets.main
        }
    }
}

dependencies {
    implementation project(":common")
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${minecraft_version}:${mapping_version}@zip")
    }
    compileOnly "net.minecraftforge:forge:${minecraft_version}-${forge_version}:universal"
    compileOnly "net.minecraftforge:eventbus:6.0.3"

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    modRuntimeOnly "com.terraformersmc:modmenu:7.2.2"

    //compileOnly "com.demonwav.mcdev:annotations:1.0" // only to shut up compile warnings from CCA's usage of CheckEnv and Env
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
}

sourceSets.main.java {
    exclude 'io/github/lounode/eventwrapper/forge/**'
}

compileJava {
    source(project(":common").sourceSets.main.allSource)
    options.compilerArgs << "-Xlint:all,-classfile,-processing,-deprecation,-serial" << "-Werror"
}

sourcesJar {
    from project(":common").sourceSets.main.allJava
}

processResources {
    from project(":common").sourceSets.main.resources
    inputs.property "version", project.version

    // Exclude datagenerator .cache directory
    exclude '.cache'
}

def generateModMetadataFabric = tasks.register('generateModMetadataFabric', ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            fabric_loader_version: fabric_loader_version,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description, mod_logo: mod_logo,
            jei_version: jei_version, jei_version_range: jei_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties

    from "src/main/template"
    into "build/generated/sources/modMetaData"
}

sourceSets.main.resources.srcDir generateModMetadataFabric

afterEvaluate {
    tasks.named('ideaSyncTask').configure {
        dependsOn 'generateModMetadataFabric'
    }
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            groupId = mod_group_id
            artifactId = base.archivesName.get()
            version = project.version
            from components.java
        }
    }

    repositories {
        if (System.getenv("GITHUB_ACTIONS") != null) {
            if (System.getenv().RELEASE_MODE == null) {
                maven {
                    name = "lounode"
                    url = "https://maven.lounode.top/snapshots"
                    credentials {
                        username = System.getenv("MAVEN_USERNAME")
                        password = System.getenv("MAVEN_TOKEN")
                    }
                }
            } else {
                maven {
                    name = "lounode"
                    url = "https://maven.lounode.top/releases"
                    credentials {
                        username = System.getenv("MAVEN_USERNAME")
                        password = System.getenv("MAVEN_TOKEN")
                    }
                }
            }
        } else {
            mavenLocal()
        }
    }
}